apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.app.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
    spec:
      containers:
        - name: app
          image: "{{ .Values.app.image.name }}:{{ .Values.app.image.tag }}"
          imagePullPolicy: {{ .Values.app.image.pullPolicy }}
          ports:
            - containerPort: 80
          volumeMounts:
            - name: flag
              mountPath: /etc/ctf
              readOnly: true
            - name: nginx-tmp
              mountPath: /tmp
      volumes:
        - name: flag
          secret:
            secretName: "{{ .Release.Namespace }}-flag"
        - name: nginx-tmp
          emptyDir: {}
