version: "3"

vars:
  CHALLENGES_DIR: challenges

tasks:
  preflight:
    desc: Check required tools are installed
    cmds:
      - command -v docker   || (echo "docker not found"   && exit 1)
      - command -v kind     || (echo "kind not found"     && exit 1)
      - command -v kubectl  || (echo "kubectl not found"  && exit 1)
      - command -v helm     || (echo "helm not found"     && exit 1)
      - echo "All tools present."

  bootstrap:
    desc: Install shared cluster services (metrics-server)
    cmds:
      - helm dependency update infra/metrics-server
      - helm upgrade --install metrics-server infra/metrics-server
          --namespace kube-system
          --values infra/metrics-server/values.yaml

  ch-01:deploy:
    desc: "Deploy 01-grafana-cve [FORWARD=true LOCAL_PORT=8080 REMOTE_PORT=80]"
    cmds:
      - task: _ch:deploy
        vars: { CHALLENGE: "01-grafana-cve", FORWARD: "{{.FORWARD}}", LOCAL_PORT: "{{.LOCAL_PORT}}", REMOTE_PORT: "{{.REMOTE_PORT}}" }

  ch-01:teardown:
    desc: Teardown 01-grafana-cve
    cmds:
      - task: _ch:teardown
        vars: { CHALLENGE: "01-grafana-cve" }

  ch-02:deploy:
    desc: "Deploy 02-automount-token [FORWARD=true LOCAL_PORT=8080 REMOTE_PORT=80]"
    cmds:
      - docker build --platform linux/amd64 -t automount-token:latest {{.CHALLENGES_DIR}}/02-automount-token/app
      - kind load docker-image automount-token:latest 
      - task: _ch:deploy
        vars: { CHALLENGE: "02-automount-token", FORWARD: "{{.FORWARD}}", LOCAL_PORT: "{{.LOCAL_PORT}}", REMOTE_PORT: "{{.REMOTE_PORT}}" }

  ch-02:teardown:
    desc: Teardown 02-automount-token
    cmds:
      - task: _ch:teardown
        vars: { CHALLENGE: "02-automount-token" }

  ch-03:deploy:
    desc: "Deploy 03-image-tag [FORWARD=true LOCAL_PORT=8080 REMOTE_PORT=80]"
    cmds:
      - docker build --platform linux/amd64 -t image-tag:1.0.0 {{.CHALLENGES_DIR}}/03-image-tag/app
      - kind load docker-image image-tag:1.0.0
      - task: _ch:deploy
        vars: { CHALLENGE: "03-image-tag", FORWARD: "{{.FORWARD}}", LOCAL_PORT: "{{.LOCAL_PORT}}", REMOTE_PORT: "{{.REMOTE_PORT}}" }

  ch-03:teardown:
    desc: Teardown 03-image-tag
    cmds:
      - task: _ch:teardown
        vars: { CHALLENGE: "03-image-tag" }

  # internal tasks, not meant to be called directly by users

  _ch:forward:
    internal: true
    vars:
      RELEASE: '{{regexReplaceAll "^[0-9]+-" .CHALLENGE ""}}'
      LOCAL_PORT: '{{default "8080" .LOCAL_PORT}}'
      REMOTE_PORT: '{{default "80" .REMOTE_PORT}}'
    cmds:
      - kubectl wait --namespace {{.CHALLENGE}} --for=condition=available deployment/{{.RELEASE}} --timeout=120s
      # run in loop to keep port-forwarding alive, since it will exit if the connection is closed
      - platforms: [linux, darwin]
        cmd: |
          while true; do
            kubectl port-forward --namespace {{.CHALLENGE}} svc/{{.RELEASE}} {{.LOCAL_PORT}}:{{.REMOTE_PORT}}
            sleep 2
          done
      # run in loop to keep port-forwarding alive, since it will exit if the connection is closed
      - platforms: [windows]
        cmd: powershell -NoProfile -Command "while (1) { kubectl port-forward --namespace {{.CHALLENGE}} svc/{{.RELEASE}} {{.LOCAL_PORT}}:{{.REMOTE_PORT}}; Start-Sleep 2 }"

  _ch:deploy:
    internal: true
    vars:
      RELEASE: '{{regexReplaceAll "^[0-9]+-" .CHALLENGE ""}}'
      FORWARD: '{{default "false" .FORWARD}}'
      LOCAL_PORT: '{{default "8080" .LOCAL_PORT}}'
      REMOTE_PORT: '{{default "80" .REMOTE_PORT}}'
    cmds:
      - kubectl create namespace {{.CHALLENGE}}
      - platforms: [linux, darwin]
        cmd: |
          kubectl create secret generic {{.CHALLENGE}}-flag \
            --namespace {{.CHALLENGE}} \
            --from-literal=flag="ctf{$(openssl rand -hex 16)}" \
            --dry-run=client -o yaml | kubectl apply -f -
      - platforms: [windows]
        cmd: |
          powershell -Command "\$r=Get-Random; kubectl create secret generic {{.CHALLENGE}}-flag --namespace {{.CHALLENGE}} \"--from-literal=flag=ctf{\$r}\" --dry-run=client -o yaml" | kubectl apply -f -
      - helm dependency build {{.CHALLENGES_DIR}}/{{.CHALLENGE}}/chart
      - helm upgrade --install {{.RELEASE}} {{.CHALLENGES_DIR}}/{{.CHALLENGE}}/chart
          --namespace {{.CHALLENGE}} --create-namespace
      - task: _ch:forward
        vars: { CHALLENGE: "{{.CHALLENGE}}", LOCAL_PORT: "{{.LOCAL_PORT}}", REMOTE_PORT: "{{.REMOTE_PORT}}" }
        when: '{{eq .FORWARD "true"}}'

  _ch:teardown:
    internal: true
    vars:
      RELEASE: '{{regexReplaceAll "^[0-9]+-" .CHALLENGE ""}}'
    cmds:
      - helm uninstall {{.RELEASE}} --namespace {{.CHALLENGE}} --ignore-not-found
      - kubectl delete namespace {{.CHALLENGE}} --ignore-not-found
